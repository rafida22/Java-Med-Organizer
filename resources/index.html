<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediTrack</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root {
           --primary-color: #1f2937; 
            --secondary-color: #1f2937;
            /* --- CHANGE 1: Form background is now solid white --- */
            --card-bg-color: rgb(255, 255, 255); 
            --text-color: #111827;
            --border-color: #d1d5db;
            /* --- CHANGE 2: New color for input fields --- */
            --input-bg-color: #f3f4f6; /* Light grey */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('/resources/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.6); /* Even more transparent for intense blur */
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(40px); /* Much stronger blur for intense frosted glass effect */
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 24px; font-weight: 700; color: var(--secondary-color); margin: 0 0 8px 0; }
        .header p { color: #4b5563; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-color); }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.7);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #2563eb; }
        .toggle-form { text-align: center; margin-top: 24px; color: #4b5563; }
        .toggle-form a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Login Form -->
        <form id="login-form">
            <div class="header">
                <h1>Welcome Back!</h1>
                <p>Please enter your details to sign in.</p>
            </div>
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            <button type="button" class="btn" onclick="login()">Sign In</button>
            <p class="toggle-form">
                Don't have an account? <a href="#" onclick="toggleForms()">Sign up</a>
            </p>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="hidden">
            <div class="header">
                <h1>Create Account</h1>
                <p>Get started by creating a new account.</p>
            </div>
            <div class="form-group">
                <label for="signup-username">Username</label>
                <input type="text" id="signup-username" name="username" required>
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" required>
            </div>
            <button type="button" class="btn" onclick="signup()">Sign Up</button>
            <p class="toggle-form">
                Already have an account? <a href="#" onclick="toggleForms()">Sign in</a>
            </p>
        </form>
    </div>
    <script>
        function toggleForms() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('signup-form').classList.toggle('hidden');
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });
            const result = await response.json();
            if (result.success) {
                window.location.href = `/dashboard?userId=${result.userId}&username=${encodeURIComponent(result.username)}`;
            } else {
                alert(result.message);
            }
        }

        async function signup() {
            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;
            const response = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });
            const result = await response.json();
            if (result.success) {
                window.location.href = `/dashboard?userId=${result.userId}&username=${encodeURIComponent(result.username)}`;
            } else {
                alert(result.message);
            }
        }
    </script>
</body>
</html>
